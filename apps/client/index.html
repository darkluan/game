<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <!-- Assets are linked relatively; this makes them resolve from the site root on any route such as /r/CODE.
         A host serving the app under a sub-path rewrites it. -->
    <base href="/" />
    <!-- viewport-fit=cover lets the game use the whole screen of a phone with a notch. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Tứ Tộc</title>
    <meta name="description" content="MOBA 3v3 một đường, chơi ngay trên trình duyệt." />
    <meta name="theme-color" content="#0b1016" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <!-- Lets the game be installed as an app: its own icon, no address bar. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tứ Tộc" />
    <!-- Filled in by the host at deploy time, e.g. {"serverUrl":"https://game.example.com"} -->
    <script id="__runtime_config__" type="application/json">
      {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
